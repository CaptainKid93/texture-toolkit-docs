# Validate on PR/main. Publishing requires an explicit manual dispatch with publish=true
# on main after documentation approval and GitHub Pages configured for GitHub Actions.
name: Documentation (MkDocs)

on:
  pull_request:
    paths:
      - "docs/**"
      - mkdocs.yml
      - requirements-docs.txt
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - mkdocs.yml
      - requirements-docs.txt
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the public docs from main? Requires release approval."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up documentation Python (not Unreal Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation (strict)
        run: mkdocs build --strict
      - name: Upload for explicitly requested Pages publication
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish approved documentation
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
